name: Build

# The merge gate for pull requests, and the check of every commit on `main`. It runs the same build local setup
# does (`setup.build.sh`), then the checks of the `verify` skill's full protocol. Each pull request is green on its
# own; two of them landing one after the other can still break `main` together, which the push build shows. For a stacked PR GitHub builds each node as the
# cumulative state of the chain up to it, so a green node means that slice compiles on its own.
#
# No secrets: the job runs on a plain runner, which is why `setup.build.sh` holds nothing that needs
# credentials or local infrastructure. The job name `Build` is the required check on the `main`
# ruleset — keep it stable.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# A new push to a pull request makes its running build moot; on `main` every commit keeps its own result.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The gitlink is the pin (nzyme/docs/consumers.md). nzyme is public, so the default token
          # clones it.
          submodules: recursive

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          # Follows package.json's `packageManager`, so the runner cannot drift from local.
          bun-version-file: package.json

      # flaneur runs on Node too: its CLI test also starts the built bin on Node.
      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build
        run: bash setup.build.sh

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint:check

      - name: Format
        run: bun run format:check

      - name: Tests
        run: bun run tests:full
