# Publishes `flaneur` (packages/flaneur) to npm. A pushed `v*` tag publishes the version that tag
# names; a manual dispatch publishes the version in packages/flaneur/package.json at the chosen ref.
#
# Authentication is npm trusted publishing (OIDC, `id-token: write`) with provenance: no token is
# stored. Trusted publishing is configured on npmjs.com for an existing package only, so the very
# first publish needs a one-off `NPM_TOKEN` secret; once the trusted publisher is set, delete it.
#
# The package depends on `@nzyme/*` as `workspace:*`. `bun pm pack` rewrites those to the exact
# versions of the pinned nzyme packages, which must therefore be on npm already; `npm publish` then
# uploads that tarball, since bun cannot publish through OIDC.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing (OIDC) and npm provenance.
      id-token: write
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # npm >= 11.5.1 is required for trusted publishing.
      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install -g npm@latest

      - name: Check the tag matches the package version
        if: github.ref_type == 'tag'
        run: |
          version=$(jq -r .version packages/flaneur/package.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match packages/flaneur/package.json version $version."
            exit 1
          fi

      - name: Build
        run: bash setup.build.sh

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun run tests:full

      - name: Pack
        id: pack
        working-directory: packages/flaneur
        run: |
          tarball=$(bun pm pack --quiet --destination "$RUNNER_TEMP" | tail -1)
          tarball="$RUNNER_TEMP/$(basename "$tarball")"
          if tar -xOzf "$tarball" package/package.json | grep -q '"workspace:'; then
            echo "::error::The packed package.json still has a workspace: dependency."
            exit 1
          fi
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      # Only for the first publish, before the trusted publisher exists. Without the secret, npm
      # authenticates through OIDC.
      - name: Configure npm token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        if: env.NPM_TOKEN != ''
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc

      - name: Publish to npm
        run: npm publish "${{ steps.pack.outputs.tarball }}" --provenance --access public
