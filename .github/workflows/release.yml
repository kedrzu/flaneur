# Publishes `flaneur` (packages/flaneur) to npm. A pushed `v*` tag publishes the version that tag
# names; a manual dispatch publishes the version in packages/flaneur/package.json at the chosen ref.
#
# Authentication is npm trusted publishing (OIDC, `id-token: write`) with provenance: no token is
# stored. npm accepts a trusted publisher for an existing package only, so the first version was
# published from the maintainer's machine by scripts/bootstrapNpm.sh, which also set the publisher.
# A version already on npm is not published again: the run still builds and tests it.
#
# The package depends on `@nzyme/*` as `workspace:*`. `bun pm pack` rewrites those to the exact
# versions of the pinned nzyme packages, which must therefore be on npm already, with the same source
# as the pin (scripts/packRelease.sh checks both through scripts/checkPackedRelease.sh); `npm publish`
# then uploads that tarball, since bun cannot publish through OIDC.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing (OIDC) and npm provenance.
      id-token: write
    env:
      CI: 'true'
    # An explicit `bash` runs with `-o pipefail`: a failing `scripts/packRelease.sh | tail -1` fails the step.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # npm >= 11.5.1 is required for trusted publishing.
      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install -g npm@latest

      - name: Check the tag matches the package version
        if: github.ref_type == 'tag'
        run: |
          version=$(jq -r .version packages/flaneur/package.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match packages/flaneur/package.json version $version."
            exit 1
          fi

      - name: Build
        run: bash setup.build.sh

      - name: Typecheck
        run: bun run typecheck

      # The own-Chrome tests run Chrome with a window, as in build.yml, so they need an X server on the runner.
      - name: Tests
        run: xvfb-run --auto-servernum bun run tests:full

      # Also checks the tarball against npm: the tests ran on the pinned nzyme source, users install
      # `@nzyme/*` from npm, and the release stops when the two differ or a version is not on npm.
      - name: Pack
        id: pack
        run: |
          tarball=$(bash scripts/packRelease.sh "$RUNNER_TEMP" | tail -1)
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Check whether the version is on npm
        id: published
        run: |
          version=$(jq -r .version packages/flaneur/package.json)
          if [ -n "$(npm view "flaneur@$version" version 2> /dev/null)" ]; then
            echo "::notice::flaneur@$version is on npm already: not publishing it again."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.published.outputs.skip != 'true'
        run: npm publish "${{ steps.pack.outputs.tarball }}" --provenance --access public
